# Banco isolado usado somente pelos testes automatizados
spring.datasource.url=jdbc:h2:mem:cfwebtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# As tabelas de teste s\u00e3o criadas ao iniciar e removidas ao finalizar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Impede a execu\u00e7\u00e3o de scripts SQL do ambiente principal
spring.sql.init.mode=never

# O console H2 n\u00e3o \u00e9 necess\u00e1rio durante os testes
spring.h2.console.enabled=false
