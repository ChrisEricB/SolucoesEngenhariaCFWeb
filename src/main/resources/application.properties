spring.application.name=SolucoesEngenhariaCFWeb

# Conex\u00e3o com o banco MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/solucoes_engenharia_cf_web?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${CFWEB_DB_SENHA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configura\u00e7\u00f5es do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configura\u00e7\u00e3o do Thymeleaf
spring.thymeleaf.cache=false

# Porta da aplica\u00e7\u00e3o
server.port=8080

# Tempo m\u00e1ximo da sess\u00e3o sem atividade
server.servlet.session.timeout=30m

# Limite para envio de documentos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
